name: test
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  ready-valid:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python3 -m unittest discover -s tests -v
      - run: python3 run.py --evidence-dir evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-valid-evidence
          path: evidence/
